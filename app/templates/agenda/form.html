{% extends "base.html" %}
{% block title %}Novo horário | SIGMon{% endblock %}
{% block page_heading %}Novo horário{% endblock %}
{% block content %}
<form class="panel form-grid" method="post">
  <label>Alocação
    <select name="id_alocacao">{% for a in alocacoes %}<option value="{{ a.id_alocacao }}">{{ get_disciplina(a.id_disciplina).nome }} - {{ get_turma(a.id_turma).codigo_turma }}</option>{% endfor %}</select>
  </label>
  <label>Data <input type="date" name="data_slot" required></label>
  <label>Hora início <input type="time" name="hora_inicio" required></label>
  <label>Hora fim <input type="time" name="hora_fim" required></label>
  <label>Modalidade
    <select name="modalidade"><option>PRESENCIAL</option><option>ONLINE</option><option>HIBRIDA</option></select>
  </label>
  <label>Local ou link <input name="local_atendimento" required></label>
  <div class="actions full">
    <button class="btn btn-primary">Criar horário</button>
    <a class="btn btn-outline" href="{{ url_for('agenda.index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
