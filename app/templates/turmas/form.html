{% extends "base.html" %}
{% block title %}Turma | SIGMon{% endblock %}
{% block page_heading %}{{ "Editar" if turma else "Nova" }} turma{% endblock %}
{% block content %}
<form class="panel form-grid" method="post">
  <label>Disciplina
    <select name="id_disciplina">{% for d in disciplinas %}<option value="{{ d.id_disciplina }}" {% if turma and turma.id_disciplina == d.id_disciplina %}selected{% endif %}>{{ d.codigo }} - {{ d.nome }}</option>{% endfor %}</select>
  </label>
  <label>Professor
    <select name="id_professor">{% for p in professores %}<option value="{{ p.id_usuario }}" {% if turma and turma.id_professor == p.id_usuario %}selected{% endif %}>{{ p.nome }}</option>{% endfor %}</select>
  </label>
  <label>Semestre <input name="semestre" value="{{ turma.semestre if turma else '2026.1' }}" required></label>
  <label>Turma <input name="codigo_turma" placeholder="T01" value="{{ turma.codigo_turma if turma else '' }}" required></label>
<label>Horário
    <select name="id_horario">
      {% for h in horarios %}
      <option value="{{ h.id_horario }}" {% if turma and turma.id_horario == h.id_horario %}selected{% endif %}>{{ h.codigo }} — {{ h.descricao }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Sala <input name="sala" value="{{ turma.sala if turma else '' }}" required></label>
  <label>Vagas de monitor <input type="number" name="vagas_monitor" min="0" value="{{ turma.vagas_monitor if turma else 0 }}" required></label>
  <label>Carga horária semanal (h) <input type="number" name="carga_horaria_semanal" min="1" value="{{ turma.carga_horaria_semanal if turma else 12 }}" required></label>
  <div class="actions full">
    <button class="btn btn-primary">Salvar</button>
    <a class="btn btn-outline" href="{{ url_for('turmas.index') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
